; HPlayer0 — M5Stack Core + Module Audio (M144) looping audio player.
;
; Platform: the pioarduino fork pinned by release URL. The registry `espressif32`
; platform ships Arduino core 2.x, which ESP32-audioI2S >= 3.x cannot build against
; (it needs the IDF 5 I2S driver). Upgrade by changing the pinned URL on purpose.
; pioarduino needs Python <= 3.13: use ~/.platformio/penv313/bin/pio.
;
; ESP32-audioI2S is pinned by git tag: the registry copy is ancient. It needs PSRAM,
; so the Core Basic (no PSRAM) is not a target of this engine — see docs/DESIGN.md.

[platformio]
default_envs = cores3

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 1500000
extra_scripts = post:scripts/copy_firmware.py
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DHP_VERSION=\"0.1.0\"
    ; the UI runs on the Arduino loop task: sprite work + menu, give it room
    -DARDUINO_LOOP_STACK_SIZE=12288
lib_deps =
    m5stack/M5Unified@^0.2.21
    m5stack/M5GFX@^0.2.17
    https://github.com/schreibfaul1/ESP32-audioI2S.git#3.4.7

; M5Stack CoreS3 SE (and CoreS3: M5Unified tells them apart at runtime). The only target.
; Module Audio pin switch must be on B.
[env:cores3]
board = m5stack-cores3
board_build.partitions = default_16MB.csv
build_flags =
    ${env.build_flags}
    -DHP_BOARD=\"cores3\"
